name: Release wheels

# Builds abi3 wheels on real Linux / macOS / Windows runners, installs each one into a
# clean Python and runs the test suite against it. Run it by hand from the Actions tab,
# or push a tag like v0.2.0. Publishing is a separate, manual job.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload to: none | testpypi | pypi"
        default: "none"
  push:
    tags: ["v*"]

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: "2014" }
          - { os: ubuntu-latest, target: aarch64, manylinux: "2014" }
          - { os: macos-14, target: universal2-apple-darwin }
          - { os: windows-latest, target: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  test:
    needs: wheels
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-latest] # ubuntu-latest (26.04) has no Python 3.9
        python: ["3.9", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Install the wheel (not the source tree) and test it
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy matplotlib
          python -m pip install --no-index --find-links dist ferrifuzz
          cd tests/python && MPLBACKEND=Agg python -m pytest -q -p no:cacheprovider .

  publish:
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.publish != 'none'
    runs-on: ubuntu-latest
    environment: ${{ inputs.publish }}
    permissions:
      id-token: write # trusted publishing — configure the project on (test.)pypi.org first
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ inputs.publish == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          packages-dir: dist
