name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Test core crate (pure Rust, no Python needed)
        run: cargo test -p ferrifuzz --all-targets
      - name: Doc tests
        run: cargo test -p ferrifuzz --doc
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel and run pytest
        run: |
          python -m venv .venv
          .venv/bin/pip install maturin pytest numpy
          .venv/bin/maturin develop --release
          .venv/bin/pytest -q
          for f in examples/python/*.py; do .venv/bin/python "$f" > /dev/null; done
