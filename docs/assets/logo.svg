  xmlns="http://www.w3.org/2000/svg"
>

  <!-- Background -->
  <rect width="256" height="256" rx="32" fill="#0f1220"/>

  <!-- Left membership curve -->
  <path
    d="M40 170
       C60 90, 90 60, 128 60
       C110 110, 95 150, 88 170
       Z"
